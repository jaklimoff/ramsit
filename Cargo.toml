[package]
name = "ramsit"
version = "0.1.0"
edition = "2021"
description = "Tiny serverless P2P terminal chat over UDP with STUN NAT hole-punching"
license = "MIT"
repository = "https://github.com/jaklimoff/ramsit"
readme = "README.md"
keywords = ["p2p", "chat", "stun", "nat-traversal", "udp"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
env_logger = "0.11"
log = "0.4"
ratatui = "0.29"
stunclient = "0.4"
