name: release

# Push to main: semantic-release reads the conventional-commit history,
# bumps the version, tags it, and publishes a GitHub Release. When a release
# is cut, the build job attaches the macOS + Windows installers to it.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14 # Apple Silicon
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          - platform: windows-latest # x86_64 (ROG Flow AMD)
            args: ""
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      # Check out the tag semantic-release just created, which carries the
      # bumped version in tauri.conf.json / Cargo.toml.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # audiopus_sys bundles libopus whose CMakeLists declares a pre-3.5
          # minimum, which CMake 4.x (on the runners) rejects. Allow it.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        with:
          # Upload to the release semantic-release already published for this tag.
          tagName: v${{ needs.release.outputs.version }}
          releaseName: "ramsit v${{ needs.release.outputs.version }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
